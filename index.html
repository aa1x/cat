                '捣乱专家', '太卜糍', '幸运点心', '墨镜猫咪', '天使圣代', '蓝莓罐子', '白玉青团', '糯米团'
            ];

            const dom = {

                submitBtn: document.getElementById('submitBtn'),

                shCat: document.getElementById('searchCatSelect'),
                shBtn: document.getElementById('searchBtn'),
                results: document.getElementById('resultsArea'),
                nextRefresh: document.getElementById('nextRefreshText'),
                weeklyCount: document.getElementById('weeklyCountText'),
                searchPanel: document.getElementById('searchPanel'),
                uploadPanel: document.getElementById('uploadPanel'),
                searchTabBtn: document.getElementById('searchTabBtn'),
                uploadTabBtn: document.getElementById('uploadTabBtn'),
                panelSwitcher: document.querySelector('.panel-switcher'),
                contentGrid: document.querySelector('.content-grid'),

                uploadColumn: document.getElementById('uploadColumn'),
                locationGroups: document.getElementById('locationGroups'),
                locationSection: document.getElementById('locationSection'),
                locationToggleLabel: document.getElementById('locationToggleLabel'),

                filterMenu: document.getElementById('filterMenu'),
                announcementModalMask: document.getElementById('announcementModalMask'),
                announcementCloseBtn: document.getElementById('announcementCloseBtn'),
                announcementTitle: document.getElementById('announcementTitle'),
                announcementTime: document.getElementById('announcementTime'),
                announcementContent: document.getElementById('announcementContent'),
                announcementSnoozeInput: document.getElementById('announcementSnoozeInput'),
                announcementConfirmBtn: document.getElementById('announcementConfirmBtn'),
                ajiReportModalMask: document.getElementById('ajiReportModalMask'),
                ajiReportCloseBtn: document.getElementById('ajiReportCloseBtn'),
                ajiReportPrompt: document.getElementById('ajiReportPrompt'),
                ajiReportLoading: document.getElementById('ajiReportLoading'),
                ajiReportActions: document.getElementById('ajiReportActions'),
                ajiReportWarning: document.getElementById('ajiReportWarning'),
                catCakeMarkModalMask: document.getElementById('catCakeMarkModalMask'),
                catCakeMarkCloseBtn: document.getElementById('catCakeMarkCloseBtn'),
                catCakeMarkPrompt: document.getElementById('catCakeMarkPrompt'),
                pageLoadingOverlay: document.getElementById('pageLoadingOverlay')
            };

            let selectedSet = new Set();
            let selectedOrder = [];
            let selectedLocations = [null, null, null];
            const ajiDailyState = new Map();

            function getServerByUid(uid) {
                if (uid.startsWith('1')) return '官服';
                if (uid.startsWith('5')) return 'B服';
                return '';
            }

            function getSelectedCatsOrdered() {
                return [...selectedOrder];
            }

            window.showToast = function (msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                if (type === 'error') {
                    container.querySelectorAll('.toast.error').forEach(node => node.remove());
                }
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            };

            window.copyText = function (text) {
                if (!text) return;
                navigator.clipboard.writeText(text).then(() => {
                    showToast('复制成功', 'success');
                }).catch(() => {
                    const input = document.createElement('input');
                    input.value = text;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    input.remove();
                    showToast('复制成功', 'success');
                });
            };


            function getShanghaiWeekStart(now = new Date()) {
                const shanghaiOffsetMs = 8 * 60 * 60 * 1000;
                const weekMs = 7 * 24 * 60 * 60 * 1000;
                const shNowMs = now.getTime() + shanghaiOffsetMs;
                const shNow = new Date(shNowMs);
                const day = shNow.getUTCDay();
                const diffToMonday = day === 0 ? 6 : day - 1;

                let weekStartShMs = Date.UTC(
                    shNow.getUTCFullYear(),
                    shNow.getUTCMonth(),
                    shNow.getUTCDate() - diffToMonday,
                    4,
                    0,
                    0,
                    0
                );

                if (shNowMs < weekStartShMs) {
                    weekStartShMs -= weekMs;
                }

                return new Date(weekStartShMs - shanghaiOffsetMs);
            }

            function formatShanghaiMonthDay(date) {
                const formatter = new Intl.DateTimeFormat('zh-CN', {
                    timeZone: TIMEZONE,
                    month: 'numeric',
                    day: 'numeric'
                });
                const parts = Object.fromEntries(formatter.formatToParts(date).map(p => [p.type, p.value]));
                return `${Number(parts.month)}/${Number(parts.day)}`;
            }

            function updateMetaStatus() {
                const weekStart = getShanghaiWeekStart();
                const nextRefresh = new Date(weekStart.getTime() + 7 * 24 * 60 * 60 * 1000);
                dom.nextRefresh.textContent = formatShanghaiMonthDay(nextRefresh);
            }

            async function apiGet(path) {
                const res = await fetch(API_BASE + path);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw { message: err.message || '请求失败', code: err.code, status: res.status };
                }
                return res.json();
            }

            async function apiPost(path, body) {
                const res = await fetch(API_BASE + path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw { message: err.message || '请求失败', code: err.code, status: res.status };
                }
                return res.json();
            }


            function getAnnouncementSignature(announcement) {
                return [announcement?.id, announcement?.updated_at || announcement?.published_at || announcement?.created_at || ''].join(':');
            }

            function escapeHtml(value) {
                return String(value ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function escapeAttribute(value) {
                return escapeHtml(value).replace(/`/g, '&#96;');
            }

            function getMarkReasonSummary(reasons) {
                return Array.isArray(reasons) && reasons.length > 0 ? reasons.join('、') : '';
            }

            function renderMarkIndicator(reasons) {
                const summary = getMarkReasonSummary(reasons);
                if (!summary) return '';
                const safeSummary = escapeAttribute(`该UID可能：${summary}`);
                return `<button class="result-mark-indicator" type="button" title="${safeSummary}" aria-label="${safeSummary}" onclick="event.stopPropagation(); showToast('${safeSummary}', 'info')">!</button>`;
            }

            function normalizeAnnouncementMarkdown(content) {
                let markdown = String(content || '')
                    .replace(/\\r\\n/g, '\n')
                    .replace(/\\n/g, '\n')
                    .replace(/\r\n?/g, '\n')
                    .trim();

                const lineBreakCount = (markdown.match(/\n/g) || []).length;
                if (lineBreakCount < 2) {
                    markdown = markdown
                        .replace(/\s+(#{1,6}\s+)/g, '\n\n$1')
                        .replace(/\s+(---|\*\*\*|___)(?=\s|$)/g, '\n\n$1\n\n')
                        .replace(/\s+(>\s+)/g, '\n\n$1')
                        .replace(/\s+(-\s+\S)/g, '\n$1')
                        .replace(/\s+(举报原因包括：|举报提交后|这可以|系统会|处理结果包括：|如果某|页面现在|官服与)/g, '\n\n$1')
                        .replace(/(#{1,6}\s+[^\n]*?(?:功能|优化|数据自动清理|管理面板调整))\s+(?=\S)/g, '$1\n\n');
                }

                return markdown;
            }

            function renderAnnouncementMarkdown(content) {
                const markdown = normalizeAnnouncementMarkdown(content);
                if (!markdown) return '';

                if (window.marked && window.DOMPurify) {
                    marked.setOptions({
                        gfm: true,
                        breaks: true
                    });
                    const html = marked.parse(markdown);
                    return DOMPurify.sanitize(html, {
                        USE_PROFILES: { html: true },
                        ADD_ATTR: ['target', 'rel']
                    }).replace(/<a\s/gi, '<a target="_blank" rel="noopener noreferrer" ');
                }

                return escapeHtml(markdown).replace(/\n/g, '<br>');
            }

            function formatAnnouncementTime(value) {
                if (!value) return '';
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return value;
                return new Intl.DateTimeFormat('zh-CN', {
                    timeZone: TIMEZONE,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false,
                }).format(date);
            }

            function closeAnnouncementModal() {
                const signature = dom.announcementModalMask.dataset.signature;
                if (dom.announcementSnoozeInput.checked && signature) {
                    localStorage.setItem(LS_KEY_ANNOUNCEMENT_ACK, signature);
                }
                dom.announcementModalMask.classList.remove('open');
                dom.announcementModalMask.setAttribute('aria-hidden', 'true');
            }

            function openAnnouncementModal(announcement) {
                const signature = getAnnouncementSignature(announcement);
                dom.announcementModalMask.dataset.signature = signature;
                dom.announcementTitle.textContent = announcement.title || '公告';
                const timeText = formatAnnouncementTime(announcement.published_at || announcement.created_at);
                dom.announcementTime.textContent = timeText ? `发布时间：${timeText}` : '';
                dom.announcementTime.dateTime = announcement.published_at || announcement.created_at || '';
                dom.announcementContent.innerHTML = renderAnnouncementMarkdown(announcement.content || '');
                dom.announcementSnoozeInput.checked = false;
                dom.announcementModalMask.classList.add('open');
                dom.announcementModalMask.setAttribute('aria-hidden', 'false');
            }

            async function fetchAnnouncement() {
                try {
                    const announcement = await apiGet('/announcement');
                    if (!announcement || !announcement.id) return;
                    const signature = getAnnouncementSignature(announcement);
                    if (localStorage.getItem(LS_KEY_ANNOUNCEMENT_ACK) === signature) return;
                    openAnnouncementModal(announcement);
                } catch (err) {
                    console.warn('公告加载失败', err);
                }
            }

            async function openAjiReportModal(server) {
                const uid = ajiDailyState.get(server);
                if (!uid) {
                    showToast(`${server}当前没有可举报的阿基喵利 UID`, 'info');
                    return;
                }
                dom.ajiReportModalMask.dataset.server = server;
                dom.ajiReportModalMask.dataset.uid = uid;
                showAjiReportLoading();
                dom.ajiReportModalMask.classList.add('open');
                dom.ajiReportModalMask.setAttribute('aria-hidden', 'false');

                try {
                    const state = await apiGet(`/aji-report?server=${encodeURIComponent(server)}&uid=${encodeURIComponent(uid)}`);
                    if (state.valid_after_report) {
                        showAjiReportValidMessage(state.message || '该UID已在被举报后由管理员判定为有效,请勿虚假举报');
                        return;
                    }
                    showAjiReportChoices(`举报${uid}的原因`);
                } catch (err) {
                    showToast(err.message || '举报状态检查失败', 'error');
                    closeAjiReportModal();
                }
            }

            function closeAjiReportModal() {
                dom.ajiReportModalMask.classList.remove('open');
                dom.ajiReportModalMask.setAttribute('aria-hidden', 'true');
                delete dom.ajiReportModalMask.dataset.server;
                delete dom.ajiReportModalMask.dataset.uid;
                showAjiReportChoices('');
            }

            function showAjiReportLoading() {
                dom.ajiReportLoading.hidden = false;
                dom.ajiReportPrompt.hidden = true;
                dom.ajiReportPrompt.textContent = '';
                dom.ajiReportActions.hidden = true;
                dom.ajiReportWarning.hidden = true;
            }

            function showAjiReportChoices(message) {
                dom.ajiReportLoading.hidden = true;
                dom.ajiReportPrompt.hidden = false;
                dom.ajiReportPrompt.textContent = message;
                dom.ajiReportActions.hidden = false;
                dom.ajiReportWarning.hidden = false;
            }

            function showAjiReportValidMessage(message) {
                dom.ajiReportLoading.hidden = true;
                dom.ajiReportPrompt.hidden = false;
                dom.ajiReportPrompt.textContent = message;
                dom.ajiReportActions.hidden = true;
                dom.ajiReportWarning.hidden = true;
            }

            async function submitAjiReport(reason) {
                const server = dom.ajiReportModalMask.dataset.server;
                const uid = dom.ajiReportModalMask.dataset.uid;
                if (!server || !uid) return;
                try {
                    await apiPost('/aji-report', { server, uid, reason });
                    showToast('举报已提交，该 UID 已隐藏，可重新上传', 'success');
                    closeAjiReportModal();
                    refreshAji();
                } catch (err) {
                    if (err.code === 'uid_valid_after_report') {
                        showAjiReportValidMessage(err.message || '该UID已在被举报后由管理员判定为有效,请勿虚假举报');
                        return;
                    }
                    showToast(err.message || '举报失败', 'error');
                    closeAjiReportModal();
                    refreshAji();
                }
            }


            window.openCatCakeMarkModal = function (uid, server) {
                dom.catCakeMarkModalMask.dataset.uid = uid;
                dom.catCakeMarkModalMask.dataset.server = server;
                dom.catCakeMarkPrompt.textContent = ``;
                dom.catCakeMarkModalMask.classList.add('open');
                dom.catCakeMarkModalMask.setAttribute('aria-hidden', 'false');
            };

            function closeCatCakeMarkModal() {
                dom.catCakeMarkModalMask.classList.remove('open');
                dom.catCakeMarkModalMask.setAttribute('aria-hidden', 'true');
                delete dom.catCakeMarkModalMask.dataset.uid;
                delete dom.catCakeMarkModalMask.dataset.server;
            }

            async function submitCatCakeMark(reason) {
                const uid = dom.catCakeMarkModalMask.dataset.uid;
                const server = dom.catCakeMarkModalMask.dataset.server;
                if (!uid || !server) return;
                try {
                    await apiPost('/cat-cake-mark', { uid, server, reason });
                    const label = CAT_CAKE_MARK_REASON_LABELS[reason] || '已标记';
                    showToast(`已标记为：${label}`, 'success');
                    closeCatCakeMarkModal();
                    await performSearch();
                } catch (err) {
                    showToast(err.message || '标记失败', 'error');
                    closeCatCakeMarkModal();
                }
            }


            async function fetchWeeklyCount() {
                try {
                    const data = await apiGet('/weekly-count');
                    dom.weeklyCount.textContent = String(data.count);
                } catch (err) {
                    console.error(err);
                    dom.weeklyCount.textContent = '加载失败';
                }
            }


            async function refreshAji() {
                const servers = ['官服', 'B服'];
                await Promise.all(servers.map(async (server) => {
                    const container = document.getElementById(`ajiContent-${server}`);
                    if (!container) return;
                    try {
                        const data = await apiGet(`/daily-aji?server=${encodeURIComponent(server)}`);
                        if (data.uid) {
                            ajiDailyState.set(server, data.uid);
                            container.innerHTML = `<span class="aji-info" onclick="copyText('${data.uid}')">${data.uid}</span>`;
                        } else {
                            ajiDailyState.set(server, null);
                            container.innerHTML = `<input type="text" class="form-input aji-input" placeholder="输入UID"><button class="btn btn-outline aji-btn" onclick="window.upAjiGlobal('${server}', this)">上传</button>`;
                        }
                    } catch (err) {
                        console.error(err);
                        ajiDailyState.delete(server);
                        container.innerHTML = '<span style="color:red;font-size:11px;">加载失败</span>';
                    }
                }));
            }


            window.upAjiGlobal = async function (server, btn) {
                const input = btn.previousElementSibling;
                const uid = input.value.trim();
                if (!/^\d{9}$/.test(uid)) {
                    showToast('UID必须为9位数字', 'error');
                    return;
                }
                const inferredServer = getServerByUid(uid);
                if (!inferredServer) {
                    showToast('UID首位必须为1或5', 'error');
                    return;
                }
                if (inferredServer !== server && ajiDailyState.get(inferredServer)) {
                    showToast(`${inferredServer}今日已有记录，不能从${server}栏上传`, 'error');
                    return;
                }
                btn.disabled = true;
                try {
                    await apiPost('/daily-aji', { uid, server: inferredServer });
                    showToast(inferredServer === server ? '上传成功' : `已自动上传到${inferredServer}栏`, 'success');
                    refreshAji();
                } catch (err) {
                    if (err.code === '23505') {
                        showToast('今日该服务器已有记录，不能重复上传', 'error');
                    } else if (err.code === '23514') {
                        showToast('数据格式错误 (UID/服务器)', 'error');
                    } else {
                        showToast('上传失败: ' + err.message, 'error');
                    }
                } finally {
                    btn.disabled = false;
                }
            };


            async function performSearch() {
                const server = dom.shServer.value;
                const cat = dom.shCat.value;
                if (!server || !cat) {
                    showToast('请选择搜索条件', 'info');
                    return;
                }

                dom.shBtn.disabled = true;
                dom.results.innerHTML = '<div style="text-align:center; padding:20px;">正在检索...</div>';

                const showLocation = dom.showLocationToggle.checked;
                const hideNoLocation = showLocation && dom.hideNoLocationToggle.checked;
                try {
                    const data = await apiGet(`/search?server=${encodeURIComponent(server)}&showLocation=${showLocation}`);
                    const filtered = (data || []).filter(r => {
                        if (!r.cat_cakes || !r.cat_cakes.includes(cat)) return false;
                        if (!hideNoLocation) return true;
                        return Array.isArray(r.cat_locations) && r.cat_locations.length === 3;
                    });
                    if (filtered.length === 0) {
                        dom.results.innerHTML = `<div style="text-align:center; padding:20px; color:#999;">本周暂无「${cat}」拥有者</div>`;
                    } else {
                        const hasCompleteLocation = (row) => Array.isArray(row.cat_locations) && row.cat_locations.length === 3;
                        const sorted = showLocation
                            ? [...filtered].sort((a, b) => Number(hasCompleteLocation(b)) - Number(hasCompleteLocation(a)))
                            : filtered;
                        const uniqueMap = new Map();
                        for (const row of sorted) {
                            const existing = uniqueMap.get(row.uid);
                            if (!existing || (showLocation && hasCompleteLocation(row) && !hasCompleteLocation(existing))) {
                                uniqueMap.set(row.uid, row);
                            }
                        }
                        const uniqueList = Array.from(uniqueMap.values());
                        dom.results.innerHTML = uniqueList.map(r => {
                            const hasLocation = showLocation && Array.isArray(r.cat_locations) && r.cat_locations.length === 3;
                            return `
                                    <div class="result-card">
                                        <div class="result-info">
                                            <div class="result-uid" onclick="copyText('${r.uid}')">${escapeHtml(r.uid)}<span class="server-tag">[${escapeHtml(r.server)}]</span>${renderMarkIndicator(r.mark_reasons)}</div>
                                            <div class="result-cats">${r.cat_cakes.map((c, idx) => `<span class="result-cat-tag ${c === cat ? 'highlight' : ''}">${escapeHtml(c)}${hasLocation ? ' · ' + escapeHtml(r.cat_locations[idx]) : ''}</span>`).join('')}</div>
                                            <button class="result-mark-btn" type="button" onclick="event.stopPropagation(); openCatCakeMarkModal('${escapeAttribute(r.uid)}', '${escapeAttribute(r.server)}')">标记</button>
                                        </div>
                                    </div>
                                `;
                        }).join('');
                    }
                } catch (err) {
                    console.error(err);
                    dom.results.innerHTML = '<div style="text-align:center; color:red;">查询出错，请重试</div>';
                } finally {
                    dom.shBtn.disabled = false;
                }
            }


            async function uploadCatCakes() {
                const uid = dom.uidInp.value.trim();
                const server = getServerByUid(uid);
                const cats = getSelectedCatsOrdered();
                const locationSelectedCount = selectedLocations.filter(Boolean).length;
                if (!/^\d{9}$/.test(uid) || cats.length !== 3 || !server) return;
                if (locationSelectedCount > 0 && locationSelectedCount < 3) {
                    showToast('已填写部分地点，请补全三个地点或清空全部地点。', 'error');
                    return;
                }
                if (locationSelectedCount === 3 && new Set(selectedLocations).size !== 3) {
                    showToast('三个猫猫糕地点不能重复，请重新选择。', 'error');
                    return;
                }

                dom.submitBtn.disabled = true;
                dom.submitBtn.textContent = '提交中...';
                try {
                    const catLocations = locationSelectedCount === 3 ? [...selectedLocations] : [];
                    await apiPost('/cat-cakes', {
                        uid,
                        cat_cakes: cats,
                        cat_locations: catLocations
                    });
                    showToast(`上传成功，已归为${server}`, 'success');
                    dom.uidInp.value = '';
                    selectedSet.clear();
                    selectedOrder = [];
                    selectedLocations = [null, null, null];
                    document.querySelectorAll('.tag-item.selected').forEach(t => t.classList.remove('selected'));
                    dom.locationSection.classList.add('collapsed');
                    updateCollapseHint();
                    renderLocationGroups();
                    updateUploadState();
                    await fetchWeeklyCount();
                } catch (err) {
                    if (err.code === '23505') {
                        showToast('你本周已经上传过该服务器的记录，不可重复', 'error');
                    } else if (err.code === '23514') {
                        showToast('数据格式错误 (UID/服务器/猫糕数量/名称)', 'error');
                    } else {
                        showToast('提交失败: ' + err.message, 'error');
                    }
                } finally {
                    dom.submitBtn.disabled = false;
                    updateUploadState();
                }
            }


            function toggleLocationSection() {
                const section = dom.locationSection;
                const isCollapsed = section.classList.contains('collapsed');
                if (isCollapsed) {
                    section.classList.remove('collapsed');
                    dom.collapseHint.textContent = '点击折叠';
                } else {
                    section.classList.add('collapsed');
                    updateCollapseHint();
                }
            }

            function updateCollapseHint() {
                const locationSelectedCount = selectedLocations.filter(Boolean).length;
                if (locationSelectedCount === 0) {
                    dom.collapseHint.textContent = '点击展开';
                } else if (locationSelectedCount === 3) {
                    dom.collapseHint.textContent = '已选3处 · 点击展开';
                } else {
                    dom.collapseHint.textContent = `已选${locationSelectedCount}/3 · 点击展开`;
                }
            }

            function updateUploadState() {
                const uid = dom.uidInp.value.trim();
                const isValidUid = /^\d{9}$/.test(uid);
                const inferredServer = isValidUid ? getServerByUid(uid) : '';
                const catsOk = selectedSet.size === 3;
                const locationSelectedCount = selectedLocations.filter(Boolean).length;
                const locationOk = locationSelectedCount === 0 || locationSelectedCount === 3;

                dom.selCount.textContent = selectedSet.size;
                if (uid.length > 0 && !isValidUid) {
                    dom.uidHint.textContent = 'UID格式错误';
                    dom.uidHint.style.color = '#ff4d4f';
                } else if (isValidUid && !inferredServer) {
                    dom.uidHint.textContent = 'UID首位必须为1或5';
                    dom.uidHint.style.color = '#ff4d4f';
                } else if (inferredServer) {
                    dom.uidHint.textContent = `将自动归为${inferredServer}`;
                    dom.uidHint.style.color = 'var(--accent-dark)';
                } else {
                    dom.uidHint.textContent = '';
                    dom.uidHint.style.color = '#ff4d4f';
                }

                if (locationSelectedCount > 0 && locationSelectedCount < 3 && dom.locationSection.classList.contains('collapsed')) {
                    dom.locationSection.classList.remove('collapsed');
                    dom.collapseHint.textContent = '点击折叠';
                }

                if (dom.locationSection.classList.contains('collapsed')) {
                    updateCollapseHint();
                } else {
                    dom.collapseHint.textContent = '点击折叠';
                }

                if (!isValidUid) {
                    dom.submitBtn.disabled = true;
                    dom.submitBtn.textContent = '请输入9位UID';
                } else if (!inferredServer) {
                    dom.submitBtn.disabled = true;
                    dom.submitBtn.textContent = 'UID首位需为1或5';
                } else if (!catsOk) {
                    dom.submitBtn.disabled = true;
                    dom.submitBtn.textContent = `还需选择 ${3 - selectedSet.size} 个`;
                } else if (!locationOk) {
                    dom.submitBtn.disabled = true;
                    dom.submitBtn.textContent = '请补全地点信息';
                } else {
                    dom.submitBtn.disabled = false;
                    dom.submitBtn.textContent = '确认上传信息';
                }
            }

            function renderLocationGroups() {
                dom.locationGroups.innerHTML = '';
                const selectedCats = getSelectedCatsOrdered();
                for (let i = 0; i < 3; i++) {
                    const group = document.createElement('div');
                    group.className = 'location-group';
                    const label = document.createElement('div');
                    label.className = 'location-group-label';
                    label.textContent = selectedCats[i] || '待选择';
                    const grid = document.createElement('div');
                    grid.className = 'location-chip-grid';
                    LOCATION_OPTIONS.forEach(loc => {
                        const chip = document.createElement('span');
                        chip.className = 'location-chip';
                        chip.textContent = loc;
                        if (selectedLocations[i] === loc) chip.classList.add('selected');
                        if (selectedLocations.includes(loc) && selectedLocations[i] !== loc) chip.classList.add('disabled');
                        chip.onclick = () => {
                            if (selectedLocations.includes(loc) && selectedLocations[i] !== loc) return;
                            selectedLocations[i] = selectedLocations[i] === loc ? null : loc;
                            renderLocationGroups();
                            updateUploadState();
                        };
                        grid.appendChild(chip);
                    });
                    group.appendChild(label);
                    group.appendChild(grid);
                    dom.locationGroups.appendChild(group);
                }
                if (dom.locationSection.classList.contains('collapsed')) {
                    updateCollapseHint();
                }
            }


            function loadShowLocationSetting() {
                const saved = localStorage.getItem(LS_KEY_SHOW_LOCATION);
                dom.showLocationToggle.checked = saved === 'true';
            }

            function saveShowLocationSetting() {
                localStorage.setItem(LS_KEY_SHOW_LOCATION, String(dom.showLocationToggle.checked));
            }

            function loadHideNoLocationSetting() {
                const saved = localStorage.getItem(LS_KEY_HIDE_NO_LOCATION);
                dom.hideNoLocationToggle.checked = saved === 'true';
            }

            function saveHideNoLocationSetting() {
                localStorage.setItem(LS_KEY_HIDE_NO_LOCATION, String(dom.hideNoLocationToggle.checked));
            }

            function syncLocationFilterState() {
                const enabled = dom.showLocationToggle.checked;
                dom.hideNoLocationToggle.disabled = !enabled;
                if (!enabled) {
                    dom.hideNoLocationToggle.checked = false;
                    saveHideNoLocationSetting();
                }
            }


            function switchPanel(mode) {
                const searchMode = mode === 'search';
                dom.searchColumn.style.display = searchMode ? '' : 'none';
                dom.uploadColumn.style.display = searchMode ? 'none' : '';
                dom.contentGrid.classList.toggle('single-panel', true);
                dom.searchTabBtn.classList.toggle('active', searchMode);
                dom.uploadTabBtn.classList.toggle('active', !searchMode);
                dom.searchTabBtn.setAttribute('aria-selected', searchMode ? 'true' : 'false');
                dom.uploadTabBtn.setAttribute('aria-selected', searchMode ? 'false' : 'true');
                dom.panelSwitcher.dataset.mode = searchMode ? 'search' : 'upload';
            }


            function initUI() {
                CAT_NAMES.forEach(name => {
                    const tag = document.createElement('div');
                    tag.className = 'tag-item';
                    tag.innerHTML = `<img src="/image/${name}.png" alt="${name}猫猫糕图标" loading="lazy" onerror="this.style.display='none'">${name}`;
                    tag.onclick = () => {
                        if (selectedSet.has(name)) {
                            const removedIndex = selectedOrder.indexOf(name);
                            selectedSet.delete(name);
                            selectedOrder = selectedOrder.filter(item => item !== name);
                            if (removedIndex > -1) {
                                selectedLocations.splice(removedIndex, 1);
                                selectedLocations.push(null);
                            }
                            tag.classList.remove('selected');
                        } else if (selectedSet.size < 3) {
                            selectedSet.add(name);
                            selectedOrder.push(name);
                            tag.classList.add('selected');
                        } else {
                            showToast('最多选择3个', 'info');
                            return;
                        }
                        renderLocationGroups();
                        updateUploadState();
                    };
                    dom.tagGrid.appendChild(tag);

                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    dom.shCat.appendChild(opt);
                });

                dom.locationSection.classList.add('collapsed');
                updateCollapseHint();
                updateUploadState();
                renderLocationGroups();
                updateMetaStatus();
                loadShowLocationSetting();
                loadHideNoLocationSetting();
                syncLocationFilterState();
                setInterval(() => {
                    updateMetaStatus();
                    refreshAji();
                }, 60000);
            }

            async function initWorker() {
                await Promise.allSettled([
                    refreshAji(),
                    fetchWeeklyCount(),
                    fetchAnnouncement()
                ]);
                document.body.classList.remove('page-loading');
                dom.pageLoadingOverlay.hidden = true;
            }

            function bindEvents() {
                dom.uidInp.addEventListener('input', () => {
                    dom.uidInp.value = dom.uidInp.value.replace(/\D/g, '');
                    updateUploadState();
                });
                dom.shBtn.addEventListener('click', performSearch);
                dom.submitBtn.addEventListener('click', uploadCatCakes);
                dom.searchTabBtn.addEventListener('click', () => {
                    const current = dom.panelSwitcher.dataset.mode || 'search';
                    switchPanel(current === 'search' ? 'upload' : 'search');
                });
                dom.uploadTabBtn.addEventListener('click', () => {
                    const current = dom.panelSwitcher.dataset.mode || 'search';
                    switchPanel(current === 'upload' ? 'search' : 'upload');
                });
                dom.panelSwitcher.addEventListener('click', (event) => {
                    if (event.target === dom.searchTabBtn || event.target === dom.uploadTabBtn) return;
                    const current = dom.panelSwitcher.dataset.mode || 'search';
                    switchPanel(current === 'search' ? 'upload' : 'search');
                });
                dom.locationToggleLabel.addEventListener('click', toggleLocationSection);
                dom.showLocationToggle.addEventListener('change', () => {
                    saveShowLocationSetting();
                    syncLocationFilterState();
                });
                dom.hideNoLocationToggle.addEventListener('change', saveHideNoLocationSetting);
                dom.filterFunnelBtn.addEventListener('click', (event) => {
                    event.stopPropagation();
                    dom.filterMenu.classList.toggle('open');
                    dom.filterMenu.setAttribute('aria-hidden', dom.filterMenu.classList.contains('open') ? 'false' : 'true');
                });
                document.addEventListener('click', (event) => {
                    if (!dom.filterMenu.classList.contains('open')) return;
                    if (dom.filterMenu.contains(event.target) || dom.filterFunnelBtn.contains(event.target)) return;
                    dom.filterMenu.classList.remove('open');
                    dom.filterMenu.setAttribute('aria-hidden', 'true');
                });
                document.querySelectorAll('[data-aji-report-server]').forEach((button) => {
                    button.addEventListener('click', () => openAjiReportModal(button.dataset.ajiReportServer));
                });
                dom.ajiReportCloseBtn.addEventListener('click', closeAjiReportModal);
                dom.ajiReportModalMask.addEventListener('click', (event) => {
                    if (event.target === dom.ajiReportModalMask) closeAjiReportModal();
                });
                dom.ajiReportModalMask.querySelectorAll('[data-aji-report-reason]').forEach((button) => {
                    button.addEventListener('click', () => submitAjiReport(button.dataset.ajiReportReason));
                });
                dom.catCakeMarkCloseBtn.addEventListener('click', closeCatCakeMarkModal);
                dom.catCakeMarkModalMask.addEventListener('click', (event) => {
                    if (event.target === dom.catCakeMarkModalMask) closeCatCakeMarkModal();
                });
                dom.catCakeMarkModalMask.querySelectorAll('[data-cat-cake-mark-reason]').forEach((button) => {
                    button.addEventListener('click', () => submitCatCakeMark(button.dataset.catCakeMarkReason));
                });
                dom.announcementCloseBtn.addEventListener('click', closeAnnouncementModal);
                dom.announcementConfirmBtn.addEventListener('click', closeAnnouncementModal);
                dom.announcementModalMask.addEventListener('click', (event) => {
                    if (event.target === dom.announcementModalMask) closeAnnouncementModal();
                });
            }

            function main() {
                initUI();
                switchPanel('search');
                bindEvents();
                initWorker();
            }

            main();
        })();
    </script>
</body>
</html>
